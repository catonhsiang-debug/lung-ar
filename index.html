<!DOCTYPE html> <html> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" /> <title>病變肺部 AR</title> <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.4.2/dist/aframe-master.min.js"></script> <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script> </head> <body style="margin: 0; overflow: hidden;"> <a-scene vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true;" embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
  <a-nft
    type="nft"
    url="./smoker"
    smooth="true"
    smoothCount="10"
    smoothTolerance=".01"
    smoothThreshold="5">

    <a-entity position="60 100 -50" scale="80 80 80" animation="property: scale; to: 85 85 85; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine">
      <a-cylinder position="0 0.8 0" radius="0.08" height="0.6" color="#222222" roughness="0.8"></a-cylinder>
      <a-cylinder position="-0.15 0.5 0" rotation="0 0 35" radius="0.06" height="0.4" color="#222222"></a-cylinder>
      <a-cylinder position="0.15 0.5 0" rotation="0 0 -35" radius="0.06" height="0.4" color="#222222"></a-cylinder>

      <a-entity position="-0.38 0.2 0">
        <a-sphere radius="0.36" scale="0.75 1.25 0.65" color="#1a1414" roughness="0.9"></a-sphere>
        <a-sphere position="-0.1 0.1 0.18" radius="0.12" color="#050505"></a-sphere>
        <a-sphere position="0.08 -0.15 0.16" radius="0.1" color="#0d0d0d"></a-sphere>
        <a-sphere position="-0.05 -0.05 0.2" radius="0.08" color="#551111" opacity="0.85"></a-sphere>
      </a-entity>

      <a-entity position="0.38 0.2 0">
        <a-sphere radius="0.4" scale="0.8 1.3 0.7" color="#241919" roughness="0.9"></a-sphere>
        <a-sphere position="0.12 0.15 0.2" radius="0.14" color="#080808"></a-sphere>
        <a-sphere position="-0.05 -0.18 0.18" radius="0.11" color="#111111"></a-sphere>
        <a-sphere position="0.05 -0.02 0.22" radius="0.09" color="#661414" opacity="0.85"></a-sphere>
      </a-entity>
    </a-entity>
  </a-nft>

  <a-entity camera></a-entity>
</a-scene>
</body> </html>
